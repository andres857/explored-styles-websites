<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icono · referencia</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* Cada referencia parte de cero: solo cuentan los estilos escritos en cada elemento. */
.ref, .ref * { all: unset; }
.ref { display: block; }
.ref .ref-media { outline: 1px dashed currentColor; outline-offset: -1px; }
body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #fff; color: #111; }
.sheet-title { font-size: 20px; margin: 0 0 4px; }
.sheet-note { font-size: 13px; color: #555; margin: 0 0 24px; }
.variant { margin: 0 0 32px; }
.variant-title { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: #333; }
.stage { padding: 16px; border: 1px dashed #bbb; overflow: auto; }
/* Estados leídos de las hojas de estilo del sitio. */

</style>
</head>
<body>
<h1 class="sheet-title">Icono</h1>
<p class="sheet-note">Referencia generada con estilos medidos. Los recuadros punteados sustituyen a iconos e imágenes.</p>
<section class="variant">
<h2 class="variant-title">icon-1 · 37 usos · 16 × 16 px</h2>
<div class="stage"><div class="ref">
  <span class="ref-media" data-media="svg" data-ref="icon-1" style="box-sizing: border-box; color: var(--color-text-secondary); cursor: pointer; display: block; flex-shrink: 0; font-family: var(--font-family-body); font-size: var(--font-size-300); font-style: normal; font-weight: var(--font-weight-400); height: 16px; letter-spacing: var(--font-letter-spacing-3); line-height: var(--font-line-height-6); overflow-x: hidden; overflow-y: hidden; text-align: left; text-transform: none; vertical-align: middle; white-space: normal; width: 16px"></span>
</div></div>
</section>
<section class="variant">
<h2 class="variant-title">icon-2 · 32 usos · 12 × 12 px</h2>
<div class="stage"><div class="ref">
  <span class="ref-media" data-media="svg" data-ref="icon-2" style="box-sizing: border-box; color: var(--color-surface); cursor: pointer; display: block; font-family: var(--font-family-1); font-size: var(--font-size-200); font-style: normal; font-weight: var(--font-weight-600); height: 12px; letter-spacing: normal; line-height: var(--font-line-height-5); overflow-x: hidden; overflow-y: hidden; text-align: center; text-transform: none; vertical-align: middle; white-space: normal; width: 12px"></span>
</div></div>
</section>
<section class="variant">
<h2 class="variant-title">icon-3 · 30 usos · 14 × 14 px</h2>
<div class="stage"><div class="ref">
  <span class="ref-media" data-media="svg" data-ref="icon-3" style="box-sizing: border-box; color: var(--color-text-secondary); cursor: pointer; display: block; flex-shrink: 0; font-family: var(--font-family-body); font-size: var(--font-size-300); font-style: normal; font-weight: var(--font-weight-400); height: 14px; letter-spacing: var(--font-letter-spacing-3); line-height: var(--font-line-height-6); overflow-x: hidden; overflow-y: hidden; text-align: left; text-transform: none; vertical-align: middle; white-space: normal; width: 14px"></span>
</div></div>
</section>
<section class="variant">
<h2 class="variant-title">icon-4 · 22 usos · 16 × 16 px</h2>
<div class="stage"><div class="ref">
  <span class="ref-media" data-media="svg" data-ref="icon-4" style="box-sizing: border-box; color: var(--color-palette-6); cursor: pointer; display: block; font-family: var(--font-family-body); font-size: var(--font-size-200); font-style: normal; font-weight: var(--font-weight-600); height: 16px; letter-spacing: normal; line-height: var(--font-line-height-5); overflow-x: hidden; overflow-y: hidden; text-align: center; text-transform: none; transition-duration: 0.15s; transition-property: transform; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); vertical-align: middle; white-space: nowrap; width: 16px"></span>
</div></div>
</section>
<section class="variant">
<h2 class="variant-title">icon-5 · 16 usos · 16 × 16 px</h2>
<div class="stage"><div class="ref">
  <span class="ref-media" data-media="svg" data-ref="icon-5" style="box-sizing: border-box; color: var(--color-palette-6); cursor: auto; display: block; font-family: var(--font-family-1); font-size: var(--font-size-400); font-style: normal; font-weight: var(--font-weight-400); height: 16px; letter-spacing: normal; line-height: var(--font-line-height-7); overflow-x: hidden; overflow-y: hidden; text-align: start; text-transform: none; vertical-align: middle; white-space: normal; width: 16px"></span>
</div></div>
</section>
<section class="variant">
<h2 class="variant-title">icon-6 · 12 usos · 12 × 12 px</h2>

</div></div>
</section>
</body>
</html>
