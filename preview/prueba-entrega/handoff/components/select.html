<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selector · referencia</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* Cada referencia parte de cero: solo cuentan los estilos escritos en cada elemento. */
.ref, .ref * { all: unset; }
.ref { display: block; }
.ref .ref-media { outline: 1px dashed currentColor; outline-offset: -1px; }
body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #fff; color: #111; }
.sheet-title { font-size: 20px; margin: 0 0 4px; }
.sheet-note { font-size: 13px; color: #555; margin: 0 0 24px; }
.variant { margin: 0 0 32px; }
.variant-title { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: #333; }
.stage { padding: 16px; border: 1px dashed #bbb; overflow: auto; }
/* Estados leídos de las hojas de estilo del sitio. */

</style>
</head>
<body>
<h1 class="sheet-title">Selector</h1>
<p class="sheet-note">Referencia generada con estilos medidos. Los recuadros punteados sustituyen a iconos e imágenes.</p>
<section class="variant">
<h2 class="variant-title">select-1 · 3 usos · 350 × 76 px</h2>
<div class="stage"><div class="ref">
  <div data-ref="select-1" aria-expanded="false" aria-label="Lorem ipsum dolor sit ameta" role="combobox" style="box-sizing: border-box; color: var(--color-palette-2); cursor: auto; display: flex; flex-direction: column; flex-grow: 1; font-family: var(--font-family-1); font-size: var(--font-size-300); font-style: normal; font-weight: var(--font-weight-400); height: 76px; letter-spacing: var(--font-letter-spacing-3); line-height: var(--font-line-height-6); position: relative; text-align: start; text-transform: none; white-space: break-spaces; width: 350px">
    <p style="box-sizing: border-box; display: block; height: 20px; width: 350px"></p>
  </div>
</div></div>
</section>
<section class="variant">
<h2 class="variant-title">select-2 · 1 usos · 350 × 40 px</h2>
<div class="stage"><div class="ref">
  <div data-ref="select-2" aria-expanded="false" aria-label="Lorem ipsum dolor sit ameta" role="combobox" style="box-sizing: border-box; color: var(--color-palette-2); cursor: auto; display: flex; flex-direction: column; flex-grow: 1; font-family: var(--font-family-1); font-size: var(--font-size-300); font-style: normal; font-weight: var(--font-weight-400); height: 40px; letter-spacing: var(--font-letter-spacing-3); line-height: var(--font-line-height-6); position: relative; text-align: start; text-transform: none; white-space: break-spaces; width: 350px">
    <p style="box-sizing: border-box; display: block; height: 20px; width: 350px"></p>
  </div>
</div></div>
</section>
</body>
</html>
