<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campo de texto · referencia</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* Cada referencia parte de cero: solo cuentan los estilos escritos en cada elemento. */
.ref, .ref * { all: unset; }
.ref { display: block; }
.ref .ref-media { outline: 1px dashed currentColor; outline-offset: -1px; }
body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #fff; color: #111; }
.sheet-title { font-size: 20px; margin: 0 0 4px; }
.sheet-note { font-size: 13px; color: #555; margin: 0 0 24px; }
.variant { margin: 0 0 32px; }
.variant-title { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: #333; }
.stage { padding: 16px; border: 1px dashed #bbb; overflow: auto; }
/* Estados leídos de las hojas de estilo del sitio. */
[data-ref="input-1"]:disabled {
  color: var(--color-palette-11) !important;
  cursor: not-allowed !important;
}
[data-ref="input-1"]:focus {
  border-bottom-color: var(--color-palette-7) !important;
  border-left-color: var(--color-palette-7) !important;
  border-right-color: var(--color-palette-7) !important;
  border-top-color: var(--color-palette-7) !important;
  box-shadow: rgb(255, 255, 255) 0px 0px 0px 0px, rgba(59, 130, 246, 0.5) 0px 0px 0px 1px, rgba(0, 0, 0, 0) 0px 0px 0px 0px !important;
}
[data-ref="input-2"]:focus {
  box-shadow: rgb(255, 255, 255) 0px 0px 0px 0px, rgba(59, 130, 246, 0.5) 0px 0px 0px 0px, rgba(0, 0, 0, 0) 0px 0px 0px 0px !important;
  outline-color: var(--color-text-primary) !important;
}
[data-ref="input-2"]:focus-visible {
  box-shadow: rgb(255, 255, 255) 0px 0px 0px 0px, rgba(59, 130, 246, 0.5) 0px 0px 0px 0px, rgba(0, 0, 0, 0) 0px 0px 0px 0px !important;
  outline-color: var(--color-text-primary) !important;
}
</style>
</head>
<body>
<h1 class="sheet-title">Campo de texto</h1>
<p class="sheet-note">Referencia generada con estilos medidos. Los recuadros punteados sustituyen a iconos e imágenes.</p>
<section class="variant">
<h2 class="variant-title">input-1 · 1 usos · 348.7 × 40 px</h2>
<div class="stage"><div class="ref">
  <input data-ref="input-1" placeholder="Lorem ipsum do" type="text" style="background-color: var(--color-surface); border-bottom-color: var(--color-palette-13); border-bottom-left-radius: var(--radius-2); border-bottom-right-radius: var(--radius-2); border-bottom-style: solid; border-bottom-width: 1px; border-left-color: var(--color-palette-13); border-left-style: solid; border-left-width: 1px; border-right-color: var(--color-palette-13); border-right-style: solid; border-right-width: 1px; border-top-color: var(--color-palette-13); border-top-left-radius: var(--radius-2); border-top-right-radius: var(--radius-2); border-top-style: solid; border-top-width: 1px; box-sizing: border-box; color: var(--color-palette-2); cursor: text; display: block; flex-basis: 0%; flex-grow: 1; font-family: var(--font-family-body); font-size: var(--font-size-300); font-style: normal; font-weight: var(--font-weight-400); height: 40px; letter-spacing: var(--font-letter-spacing-3); line-height: var(--font-line-height-6); overflow-x: clip; overflow-y: clip; padding-left: var(--space-5); padding-right: var(--space-5); text-align: start; text-transform: none; white-space: normal; width: 348.672px">
</div></div>
</section>
<section class="variant">
<h2 class="variant-title">input-2 · 1 usos · 398 × 30 px</h2>
<div class="stage"><div class="ref">
  <input data-ref="input-2" aria-label="Lorem ipsum dolor sit" placeholder="Lorem ipsum d" type="text" style="box-sizing: border-box; color: var(--color-palette-2); cursor: text; display: block; flex-basis: 0%; flex-grow: 1; font-family: var(--font-family-body); font-size: var(--font-size-300); font-style: normal; font-weight: var(--font-weight-400); height: 30px; letter-spacing: var(--font-letter-spacing-3); line-height: var(--font-line-height-6); overflow-x: clip; overflow-y: clip; text-align: start; text-transform: none; white-space: nowrap; width: 398px">
</div></div>
</section>
</body>
</html>
