<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Separador · referencia</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* Cada referencia parte de cero: solo cuentan los estilos escritos en cada elemento. */
.ref, .ref * { all: unset; }
.ref { display: block; }
.ref .ref-media { outline: 1px dashed currentColor; outline-offset: -1px; }
body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #fff; color: #111; }
.sheet-title { font-size: 20px; margin: 0 0 4px; }
.sheet-note { font-size: 13px; color: #555; margin: 0 0 24px; }
.variant { margin: 0 0 32px; }
.variant-title { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: #333; }
.stage { padding: 16px; border: 1px dashed #bbb; overflow: auto; }
/* Estados leídos de las hojas de estilo del sitio. */

</style>
</head>
<body>
<h1 class="sheet-title">Separador</h1>
<p class="sheet-note">Referencia generada con estilos medidos. Los recuadros punteados sustituyen a iconos e imágenes.</p>
<section class="variant">
<h2 class="variant-title">separator-1 · 1 usos · 1 × 16 px</h2>
<div class="stage"><div class="ref">
  <hr data-ref="separator-1" style="background-color: var(--color-palette-14); color: var(--color-text-primary); cursor: auto; display: block; flex-shrink: 0; font-family: var(--font-family-body); font-size: var(--font-size-400); font-style: normal; font-weight: var(--font-weight-400); height: 16px; letter-spacing: normal; line-height: var(--font-line-height-7); text-align: start; text-transform: none; white-space: normal; width: 1px">
</div></div>
</section>
</body>
</html>
